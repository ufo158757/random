<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>航海占卜 · 随机罗盘</title>
  <!-- 引入复古衬线字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 深海蓝 */
      --bg-deep: #0a1118;
      --bg-panel: #121c24;
      /* 羊皮纸色 */
      --text-parchment: #e2d1b3;
      --text-muted: #8a9ba8;
      /* 青铜与暗金 */
      --brass: #b58d4e;
      --brass-light: #d4b06a;
      --brass-dark: #73562b;
      --rope: #3e4d59;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-deep);
      /* 模拟深海暗纹背景 */
      background-image: 
        radial-gradient(circle at 50% 0%, #172635 0%, transparent 70%),
        repeating-linear-gradient(45deg, #0a1118 0, #0a1118 2px, #0c141c 2px, #0c141c 4px);
      color: var(--text-parchment);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: 'Cinzel', 'KaiTi', '楷体', serif;
    }

    .container {
      width: 100%;
      max-width: 480px;
      position: relative;
    }

    /* 主面板 - 模仿古老航海日志或木箱 */
    .panel {
      background: var(--bg-panel);
      border: 2px solid var(--brass-dark);
      border-radius: 4px;
      padding: 30px;
      position: relative;
      box-shadow: 
        0 0 0 1px #000, /* 外黑边 */
        0 0 0 4px var(--brass), /* 金属边框 */
        0 0 0 5px #000,
        0 15px 30px rgba(0,0,0,0.8),
        inset 0 0 50px rgba(0,0,0,0.5); /* 内部做旧阴影 */
    }

    /* 边框四个角的金属铆钉装饰 */
    .panel::before, .panel::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: radial-gradient(circle, var(--brass-light) 20%, var(--brass-dark) 80%);
      border-radius: 50%;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), 0 1px 1px rgba(255,255,255,0.2);
    }
    .panel::before { top: 8px; left: 8px; }
    .panel::after { bottom: 8px; right: 8px; }

    /* 标题部分 */
    h1 {
      text-align: center;
      font-size: 26px;
      color: var(--brass-light);
      letter-spacing: 3px;
      margin-bottom: 25px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      border-bottom: 2px solid var(--brass-dark);
      padding-bottom: 15px;
      position: relative;
    }
    
    /* 标题下的装饰线 */
    h1::after {
      content: '⚓';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-panel);
      padding: 0 10px;
      color: var(--brass);
      font-size: 16px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 14px;
      color: var(--brass-light);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    /* 输入框 - 模仿凹陷的石板/木槽 */
    input {
      width: 100%;
      padding: 12px;
      background: #080d11;
      border: 2px solid var(--rope);
      border-top-color: #000;
      border-left-color: #000;
      border-radius: 2px;
      color: var(--brass-light);
      font-size: 20px;
      font-family: 'Cinzel', serif;
      text-align: center;
      outline: none;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
      transition: all 0.3s;
    }

    input:focus {
      border-color: var(--brass);
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.8), 0 0 8px rgba(181, 141, 78, 0.4);
    }

    /* 按钮 - 模仿青铜徽章 */
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(180deg, var(--brass) 0%, var(--brass-dark) 100%);
      border: 2px solid #000;
      border-radius: 4px;
      color: #0a1118;
      font-size: 20px;
      font-weight: bold;
      font-family: 'Cinzel', 'KaiTi', '楷体', serif;
      letter-spacing: 4px;
      cursor: pointer;
      text-shadow: 0 1px 0 rgba(255,255,255,0.3);
      box-shadow: 
        0 4px 0 #3a2b14, /* 立体厚度 */
        inset 0 1px 0 rgba(255,255,255,0.4);
      transition: all 0.1s;
    }

    button:hover {
      background: linear-gradient(180deg, var(--brass-light) 0%, var(--brass) 100%);
    }

    button:active {
      transform: translateY(4px); /* 按下效果 */
      box-shadow: 
        0 0 0 #3a2b14,
        inset 0 2px 5px rgba(0,0,0,0.6);
    }

    /* 结果显示区 - 模仿罗盘或发光水晶 */
    .result-container {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      height: 140px;
      border: 2px solid var(--rope);
      border-radius: 4px;
      background: #060a0d;
      box-shadow: inset 0 0 30px #000;
      overflow: hidden;
    }

    /* 背景星芒暗纹 */
    .result-container::before {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 0 L55 45 L100 50 L55 55 L50 100 L45 55 L0 50 L45 45 Z" fill="%23b58d4e" opacity="0.1"/></svg>');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      animation: rotate 30s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .result-value {
      position: relative;
      z-index: 1;
      font-size: 56px;
      font-weight: 700;
      color: var(--brass-light);
      text-shadow: 0 0 15px rgba(181, 141, 78, 0.5);
      letter-spacing: 2px;
    }

    /* 历史记录区域 */
    .history-section {
      margin-top: 30px;
    }

    .history-title {
      font-size: 16px;
      color: var(--brass);
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--rope);
      padding-bottom: 8px;
    }

    .history-title span:last-child {
      font-size: 12px;
      color: var(--text-muted);
      font-family: sans-serif; /* 说明文字用无衬线体更清晰 */
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 5px; /* 给滚动条留空间 */
    }

    /* 自定义复古滚动条 */
    .history-list::-webkit-scrollbar {
      width: 6px;
    }
    .history-list::-webkit-scrollbar-track {
      background: #0a1118;
      border-radius: 3px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: var(--rope);
      border-radius: 3px;
    }
    .history-list::-webkit-scrollbar-thumb:hover {
      background: var(--brass-dark);
    }

    /* 单条记录 - 羊皮卷碎片感 */
    .history-item {
      background: #182530;
      padding: 12px 15px;
      border-left: 4px solid var(--brass);
      border-radius: 0 4px 4px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideIn 0.3s ease-out;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .history-num {
      font-weight: bold;
      font-size: 18px;
      color: var(--text-parchment);
    }

    .history-time {
      font-size: 13px;
      color: var(--text-muted);
      font-family: monospace; /* 时间用等宽字体对齐更整齐 */
    }

    .empty-tip {
      text-align: center;
      color: var(--text-muted);
      padding: 20px;
      font-size: 14px;
      font-style: italic;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="panel">
    <h1>深海占卜</h1>

    <div class="row">
      <div class="input-group">
        <label>下界 (MIN)</label>
        <input type="number" id="minVal" value="1">
      </div>
      <div class="input-group">
        <label>上界 (MAX)</label>
        <input type="number" id="maxVal" value="100">
      </div>
    </div>

    <button onclick="generateRandom()">投掷星盘</button>

    <div class="result-container">
      <div class="result-value" id="resultBox">--</div>
    </div>

    <div class="history-section">
      <div class="history-title">
        <span>📜 航海日志</span>
        <span>(限载10条，永不抹除)</span>
      </div>
      <div class="history-list" id="historyList">
        <!-- 历史记录渲染区 -->
      </div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'medieval_ocean_random_history';
  const MAX_RECORDS = 10;

  document.addEventListener('DOMContentLoaded', () => {
    renderHistory();
  });

  function generateRandom() {
    const min = parseInt(document.getElementById('minVal').value);
    const max = parseInt(document.getElementById('maxVal').value);

    if (isNaN(min) || isNaN(max)) {
      alert("请向星盘中输入有效的数字！");
      return;
    }
    if (min > max) {
      alert("下界坐标不可大于上界坐标！");
      return;
    }

    const randomNum = Math.floor(Math.random() * (max - min + 1)) + min;
    document.getElementById('resultBox').innerText = randomNum;

    saveHistory(randomNum);
  }

  function saveHistory(value) {
    const now = new Date();
    const timeString = now.getFullYear() + '-' +
      String(now.getMonth() + 1).padStart(2, '0') + '-' +
      String(now.getDate()).padStart(2, '0') + ' ' +
      String(now.getHours()).padStart(2, '0') + ':' +
      String(now.getMinutes()).padStart(2, '0') + ':' +
      String(now.getSeconds()).padStart(2, '0');

    const newRecord = { value: value, time: timeString };
    let history = getHistoryData();
    
    // 插入最前
    history.unshift(newRecord);

    // 限制10条
    if (history.length > MAX_RECORDS) {
      history = history.slice(0, MAX_RECORDS);
    }

    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    renderHistory();
  }

  function getHistoryData() {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
      try { return JSON.parse(data); } catch (e) { return []; }
    }
    return [];
  }

  function renderHistory() {
    const historyList = document.getElementById('historyList');
    const history = getHistoryData();
    historyList.innerHTML = '';

    if (history.length === 0) {
      historyList.innerHTML = '<div class="empty-tip">海面平静，暂无神谕...</div>';
      return;
    }

    history.forEach(record => {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `
        <span class="history-num">${record.value}</span>
        <span class="history-time">${record.time}</span>
      `;
      historyList.appendChild(item);
    });
  }
</script>

</body>
</html>
