<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联机共享掷骰</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #1a1d29;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #252938;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 580px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 26px;
            color: #7cc7ff;
        }
        .row {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }
        .input-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #b8c0d8;
        }
        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1c202c;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            box-shadow: 0 0 0 2px #7cc7ff;
        }
        .option-row {
            margin-bottom: 24px;
        }
        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        .result-box {
            margin-top: 28px;
            min-height: 70px;
            background: #1c202c;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #7cc7ff;
            padding: 16px;
            word-break: break-all;
        }
        .history-title {
            margin-top: 32px;
            font-size: 18px;
            color: #7cc7ff;
        }
        .history-list {
            margin-top: 12px;
            background: #1c202c;
            border-radius: 8px;
            padding: 16px;
            min-height: 140px;
            max-height: 420px;
            overflow-y: auto;
        }
        .history-item {
            padding: 10px 0;
            border-bottom: 1px solid #2c3448;
        }
        .player-name {
            color: #60a5fa;
            font-weight: bold;
        }
        .history-time {
            font-size: 12px;
            color: #8892aa;
            margin-top: 4px;
        }
        .tip {
            margin-top: 12px;
            font-size: 13px;
            color: #9aa4bb;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 联机共享掷骰</h1>

        <div class="row">
            <div class="input-group">
                <label>玩家昵称</label>
                <input type="text" id="playerName" value="玩家 A">
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>最小值</label>
                <input type="number" id="minNum" value="1">
            </div>
            <div class="input-group">
                <label>最大值</label>
                <input type="number" id="maxNum" value="100">
            </div>
        </div>

        <div class="option-row">
            <label>生成数量</label>
            <input type="number" id="countNum" value="1" min="1">
            <div class="checkbox-wrap">
                <input type="checkbox" id="noRepeat">
                <label for="noRepeat">不重复抽取</label>
            </div>
        </div>

        <button onclick="rollDice()">掷骰提交</button>
        <div class="result-box" id="result">--</div>

        <div class="history-title">📜 全局共享记录</div>
        <div class="history-list" id="historyBox"></div>

        <div class="tip">所有打开网页的队友，自动读取同一份掷骰记录</div>
    </div>
