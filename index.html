<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联机共享掷骰</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: #1a1d29;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
      font-family: sans-serif;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    h1 {
      text-align: center;
    }
    .input-item {
      margin: 16px 0;
    }
    label {
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-size: 18px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .checkbox-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background-color: #3684ff;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }
    .result-box {
      width: 100%;
      padding: 20px;
      margin-top: 16px;
      background: #24283b;
      border-radius: 12px;
      text-align: center;
      font-size: 32px;
    }
    .record-title {
      margin-top: 32px;
      font-size: 24px;
    }
    .record-list {
      background: #24283b;
      padding: 16px;
      border-radius: 12px;
      min-height: 120px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🎲 联机共享掷骰</h1>

  <div class="input-item">
    <label>玩家昵称</label>
    <input id="name" value="玩家 A">
  </div>

  <div class="row">
    <div class="input-item">
      <label>最小值</label>
      <input id="minVal" value="1">
    </div>
    <div class="input-item">
      <label>最大值</label>
      <input id="maxVal" value="100">
    </div>
  </div>

  <div class="input-item">
    <label>生成数量</label>
    <input id="count" value="1">
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="noRepeat">
    <label for="noRepeat">不重复抽取</label>
  </div>

  <button onclick="rollDice()">掷骰提交</button>

  <div class="result-box" id="resultBox">--</div>

  <div class="record-title">📜 全局共享记录</div>
  <div class="record-list" id="recordList"></div>
</div>

<script>
// ========= 填入你的 Supabase 信息 =========
const SUPABASE_URL = "https://hckkghduvjzfemzprejl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhja2tnaGR1dmp6ZmVtenByZWpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MTY1NzcsImV4cCI6MjEwNzk5MjU3N30.pNT4sn03ZS6vB14SQ3_h-3TEH9Dw5Z7KkkoAaaWgBtc";
// =============================================

// 【修改点】把变量名改成了 supabaseClient，避免冲突
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 掷骰主函数
async function rollDice() {
  const name = document.getElementById("name").value;
  const min = parseInt(document.getElementById("minVal").value);
  const max = parseInt(document.getElementById("maxVal").value);
  const count = parseInt(document.getElementById("count").value);
  const noRepeat = document.getElementById("noRepeat").checked;

  let results = [];
  if (noRepeat) {
    const pool = [];
    for (let i = min; i <= max; i++) pool.push(i);
    for (let i = 0; i < count && pool.length > 0; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      results.push(pool.splice(idx, 1)[0]);
    }
  } else {
    for (let i = 0; i < count; i++) {
      results.push(Math.floor(Math.random() * (max - min + 1)) + min);
    }
  }

  const resultText = results.join(", ");
  document.getElementById("resultBox").innerText = resultText;

  // 写入数据库
  // 【修改点】这里的 supabase 改成了 supabaseClient
  await supabaseClient.from("roll_history").insert([
    {
      player_name: name,
      min_val: min,
      max_val: max,
      roll_result: resultText
    }
  ]);

  loadRecords();
}

// 读取历史记录
async function loadRecords() {
  // 【修改点】这里的 supabase 改成了 supabaseClient
  const { data } = await supabaseClient
    .from("roll_history")
    .select("*")
    .order("created_at", { ascending: false });

  const recordList = document.getElementById("recordList");
  recordList.innerHTML = "";
  if (data) {
    data.forEach(row => {
      const div = document.createElement("div");
      div.style.margin = "8px 0";
      div.innerText = `${row.player_name}：${row.roll_result}`;
      recordList.appendChild(div);
    });
  }
}

// 页面加载自动读取记录
loadRecords();
// 定时自动刷新记录，实现手机电脑同步，每 3 秒拉取一次
setInterval(loadRecords, 3000);
</script>
</body>
</html>
